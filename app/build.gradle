plugins { id 'com.android.application' }

android {
    namespace 'com.controledecheques'
    compileSdk 35
    defaultConfig {
        applicationId 'com.controledecheques'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_FILE') ?: 'missing-release-key.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
